<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14322b">
<meta name="description" content="Calcul hors ligne des plus-values crypto (méthode française, formulaire 2086)">
<title>CryptoPV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface2:#f0efe9; --ink:#1b1f1d; --muted:#5f6763; --line:#dedcd4;
  --accent:#1f6b57; --accent-ink:#ffffff; --accent-soft:#e1efe9; --gain:#1f7a4d; --loss:#b3362e; --warn:#a86500;
  --warn-soft:#fbf0dc; --err-soft:#f9e3e0; --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101413; --surface:#181d1b; --surface2:#1f2522; --ink:#e8ebe9; --muted:#9aa39f; --line:#2c3430;
    --accent:#4fb393; --accent-ink:#06130f; --accent-soft:#1b2f28; --gain:#5cc58f; --loss:#ef7d73; --warn:#e3a54a;
    --warn-soft:#2e2615; --err-soft:#33201e; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;letter-spacing:-.01em;flex:1}
header.top h1 span{color:var(--accent)}
.net{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.net.on{color:var(--gain)}
main{max-width:760px;margin:0 auto;padding:12px 16px 24px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 10px;color:var(--muted);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.active{color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;letter-spacing:-.005em}
.card h3{font-size:14px;margin:12px 0 6px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.gain{color:var(--gain)} .loss{color:var(--loss)} .warn{color:var(--warn)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface2);border-radius:10px;padding:10px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:550;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--loss)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-height:40px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tx{display:flex;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx .d{width:62px;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tx .m{flex:1;min-width:0}
.tx .m .t{font-weight:600;font-size:14px}
.tx .m .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .e{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);vertical-align:1px}
.badge.tax{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--err-soft);color:var(--loss)}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0;background:var(--surface2)}
.note.warn{background:var(--warn-soft)} .note.err{background:var(--err-soft)}
.lines{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:13.5px}
.lines .k{color:var(--muted);font-variant-numeric:tabular-nums}
.lines .v{text-align:right;font-variant-numeric:tabular-nums}
.lines .strong{font-weight:700}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:6px}
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:none}
.modal.open{display:block}
.modal .bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.modal .bar h2{flex:1;margin:0;font-size:17px}
.modal .body{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.log{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);border-radius:8px;padding:8px;max-height:180px;overflow:auto;white-space:pre-wrap;display:none}
.empty{text-align:center;padding:26px 10px}
.empty p{max-width:420px;margin:8px auto 16px}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.pick:hover{border-color:var(--accent)}
.hide{display:none!important}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.big{font-size:25px}}
@media print{
  header.top,nav.tabs,.noprint,.btn{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card{border:1px solid #bbb;box-shadow:none;break-inside:avoid}
  main{max-width:none}
}
</style>
</head>
<body>
<header class="top">
  <h1>Crypto<span>PV</span></h1>
  <span id="net" class="net">chargement…</span>
</header>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-tab="tx"><svg viewBox="0 0 24 24"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>Opérations</button>
  <button data-tab="prices"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8M15 8h5v5"/></svg>Cours</button>
  <button data-tab="report"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg>Déclaration</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</button>
</nav>

<div class="modal" id="modal">
  <div class="bar"><h2 id="modalTitle"></h2><button class="btn sm" data-action="closeModal">Fermer</button></div>
  <div class="body" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileTx" accept=".csv,.txt,.tsv,.xlsx,.xls,.ods,text/csv" class="hide">
<input type="file" id="filePrice" accept=".csv,.txt,.xlsx,.xls,.ods" class="hide">
<input type="file" id="fileBackup" accept=".json,application/json" class="hide">

<script src="core.js"></script>
<script src="app.js"></script>
<script>
// Diagnostic shown when the app scripts could not be loaded (missing files on the server)
window.addEventListener('load', function () {
  if (!window.CPV || !document.getElementById('view').innerHTML) {
    document.getElementById('net').textContent = 'erreur';
    document.getElementById('view').innerHTML = '<div class="card"><h2>L\'application n\'a pas pu démarrer</h2><p class="small">Fichier manquant : ' + (!window.CPV ? 'core.js' : 'app.js') + '. Vérifiez que index.html, core.js, app.js, sw.js, manifest.webmanifest et les dossiers icons et vendor sont tous à la racine du dépôt GitHub.</p></div>';
  }
});
</script>
</body>
</html>
